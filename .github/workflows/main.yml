name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          if [ -z "$F" ]; then
            echo "ERROR: settings.gradle.kts not found. The project files were not uploaded."
            ls -R | head -50
            exit 1
          fi
          cd "$(dirname "$F")"
          echo "Project folder: $(pwd)"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FestivalCal-apk
          path: '**/app-debug.apk'
